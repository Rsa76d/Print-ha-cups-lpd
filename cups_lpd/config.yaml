---
version: 1.3.7-lpd11
slug: cups_lpd
name: CUPS Print Server (LPD)
description: CUPS print server with LPD gateway (port 515) for PrinterShare
url: https://github.com/Rsa76d/Print-ha-cups-lpd
arch:
  - aarch64
  - amd64
hassio_api: true
host_network: true
usb: true
map:
  - app_config:rw
init: false
ports:
  631/tcp: 631
  631/udp: 631
  515/tcp: 515
ports_description:
  631/tcp: CUPS web interface and printing port
  631/udp: IPP browsing / AirPrint
  515/tcp: LPD (cups-lpd) for legacy clients, e.g. PrinterShare
options:
  admin_username: "admin"
  admin_password: "admin"
  printer_driver_deb: ""
schema:
  admin_username: str
  admin_password: password
  printer_driver_deb: str
startup: services
