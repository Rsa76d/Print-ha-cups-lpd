# Publish CUPS/AirPrint on the LAN.
# lpd11: reflector disabled and the daemon is bound to the LAN interface only
# (allow-interfaces is filled in at start from the default route). With
# host_network the reflector bounced announcements between end0, docker0,
# hassio and the app veths, which made discovery slow and unreliable.
[server]
#allow-interfaces=
use-ipv4=yes
use-ipv6=yes
enable-dbus=yes
disallow-other-stacks=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
publish-hinfo=no
publish-workstation=no

[reflector]
enable-reflector=no
